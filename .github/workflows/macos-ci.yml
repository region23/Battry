name: macOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild test \
            -project Battry.xcodeproj \
            -scheme Battry \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
